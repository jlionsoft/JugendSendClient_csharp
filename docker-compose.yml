services:
  botapi:
    build:
      context: ./BotApi
      dockerfile: Dockerfile
    container_name: botapi
    environment:
      AdminPassword: ${AdminPassword}
      Authentik__BaseUrl: ${AUTHENTIK__BASE_URL}
      Authentik__Token: ${AUTHENTIK__TOKEN}
      Authentik__YouthGroupId: ${AUTHENTIK__YOUTH_GROUP_ID}
      Matrix__Homeserver: ${MATRIX__Homeserver}
      Matrix__ServerName: ${MATRIX__SERVER_NAME}
      Matrix__BotToken: ${MATRIX__BOT_TOKEN}
      Matrix__BotUserId: ${MATRIX__BOT_USER_ID}
      SMS__Gateway: ${SMS__Gateway}
      SMS__Username: ${SMS__Username}
      SMS__Password: ${SMS__Password}
      NextcloudTalk__BaseUrl: ${NextcloudTalk__BaseUrl}
      NextcloudTalk__BotSecret: ${NextcloudTalk__BotSecret}
      NextcloudTalk__DefaultRoomToken: ${NextcloudTalk__DefaultRoomToken}
      BOT_SECRET: ${NextcloudTalk__BotSecret}
      NEXTCLOUD_BASE_URL: ${NextcloudTalk__BaseUrl}
    ports:
      - "8080:8080"
    dns:
      - 1.1.1.1
    restart: unless-stopped
    networks:
      - jugend

  miniweb:
    build:
      context: ./SendClient
      dockerfile: Dockerfile
    container_name: miniweb
    environment:
      AdminPassword: ${AdminPassword}
      Authentik__BaseUrl: ${AUTHENTIK__BASE_URL}
      Authentik__ClientId: ${AUTHENTIK__CLIENT_ID}
      Authentik__ClientSecret: ${AUTHENTIK__CLIENT_SECRET}
      ApiBaseUrl: ${ApiBaseUrl}
      BotApi__BaseUrl: ${BotApi__BaseUrl}
      BotApi__SendEndpoint: ${BotApi__SendEndpoint}
      BotApi__AdminPassword: ${BotApi__AdminPassword}
    ports:
      - "8090:8080"
    dns:
      - 1.1.1.1
    restart: unless-stopped
    depends_on:
      - botapi
    volumes:
      - dpk:/root/.aspnet/DataProtection-Keys
    networks:
      - jugend

volumes:
  dpk:

networks:
  jugend:
    external: true
