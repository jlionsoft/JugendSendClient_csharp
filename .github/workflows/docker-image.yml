name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build-api:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image for bot/api
      run: docker build BotApi --file BotApi/Dockerfile --tag jsc-api:$(date +%s)



  build-web:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image for SendClient
      run: docker build SendClient --file SendClient/Dockerfile --tag jsc-web:$(date +%s)
